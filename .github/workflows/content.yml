name: Inhalte aus dem CMS übernehmen

# Ausgelöst vom Knopf „Veröffentlichen“ im CMS (über die Edge Function
# „publish“, die ein repository_dispatch schickt) oder von Hand.
#
# Der Lauf holt den Inhaltsstand aus den CMS-Tabellen, schreibt ihn in die
# Wörterbücher und Seiten-Shells, prüft das Ergebnis und committet nur, wenn
# sich wirklich etwas geändert hat. Der Push löst dann den normalen CI/CD-Lauf
# aus, der baut und deployt.
#
# Wichtig: Gepusht wird mit CONTENT_PUSH_TOKEN, nicht mit GITHUB_TOKEN. Ein
# Push mit dem eingebauten GITHUB_TOKEN startet absichtlich keine weiteren
# Workflows — der Deploy bliebe sonst aus.

on:
  repository_dispatch:
    types: [cms-publish]
  workflow_dispatch:

concurrency:
  group: cms-content
  cancel-in-progress: false

jobs:
  uebernehmen:
    runs-on: ubuntu-latest
    # Ein hängender Lauf blockiert alle folgenden (concurrency cms-content) — nie länger als 30 Minuten
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CONTENT_PUSH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Inhalte aus Supabase übernehmen
        run: npm run content:apply -- --from-supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CMS_SNAPSHOT_FILE: ${{ runner.temp }}/cms-snapshot.json

      # Bilder aus dem CMS verkleinern (WebP, höchstens 1920 px, Original bleibt) und Sitemap-Datum nachziehen
      - name: Bilder verkleinern
        run: npm run images:optimize

      # Gegenprüfung vor dem Commit: ein kaputter Inhalt darf nicht live gehen.
      - run: npm run lint
      - run: npm run test:run
      # Browser-Tests: fangen, was nur im Browser bricht (Laufzeit wendet das
      # Wörterbuch an, Navigation, Mobilansicht). Beide Projekte laufen auf Chromium.
      # Schrittnamen enthalten „playwright“/„test:e2e“ — daran erkennt die
      # Fortschrittsanzeige im CMS den Schritt (rethink-cms src/publish-progress.js).
      # Kein Browser-Download mehr: der GitHub-Runner hat Google Chrome samt Systembibliotheken schon an Bord.
      # Die Installation mit --with-deps hing am 01.10. und 26.10.2026 in apt (dpkg-Sperre) und hielt das
      # Veroeffentlichen auf. Nur falls Chrome einmal fehlt: Chromium ohne apt (keine Systempakete) nachladen.
      - name: playwright – vorinstalliertes Google Chrome des Runners
        timeout-minutes: 5
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
            echo "PW_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Google Chrome auf dem Runner - lade Chromium (ohne apt)."
            timeout 240 npx playwright install chromium
          fi
      - run: npm run test:e2e
      - run: npm run build
        env:
          VITE_CHAT_ENDPOINT: ${{ vars.VITE_CHAT_ENDPOINT }}
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}

      - name: Committen und pushen, falls sich etwas geändert hat
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Keine Änderungen — der Inhalt der Website entspricht schon dem CMS."
            exit 0
          fi
          git config user.name  "rethink-cms"
          git config user.email "contact@rethink.space"
          git add -A
          git commit -m "Inhalte aus dem CMS übernommen

          Erzeugt von .github/workflows/content.yml aus den CMS-Tabellen in
          Supabase. Texte und Bildpfade stammen aus dem Editor, nicht von Hand."
          # GitHub lehnt Pushes bei Störungen gelegentlich ab („fatal error in commit_refs“,
          # „Internal Server Error“, 04.11.2026) — dann bis zu fünfmal mit wachsender Pause versuchen
          for TRY in 1 2 3 4 5; do
            git push && exit 0
            echo "Push fehlgeschlagen (Versuch $TRY) — neuer Versuch in $((TRY * 30)) s"
            sleep $((TRY * 30))
            git pull --rebase || true
          done
          exit 1

      # Erst jetzt — nach Prüfung und Push — gilt der Stand als veröffentlicht.
      # Das CMS nimmt damit die Markierung „noch nicht online“ von allem, was
      # übernommen wurde (Tabelle cms_publishes).
      - name: Stand im CMS als veröffentlicht vermerken
        run: node scripts/record-publish.mjs "${{ runner.temp }}/cms-snapshot.json"
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
