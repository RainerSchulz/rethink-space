name: CI/CD — Lint · Test · Secret-Scan · Build · Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Vom CMS-Repo nach jedem grünen Lauf auf main: CMS-Änderungen gehen live,
  # ohne dass sich hier etwas ändert (siehe Schritt „CMS unter /cms/“).
  repository_dispatch:
    types: [cms-updated]

jobs:
  # ─── Quality Gate 1: ESLint ────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  # ─── Quality Gate 2: Vitest Unit-Tests ─────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:run

  # ─── Quality Gate 3: Secret-Scan (gitleaks) ────────────────────────
  # Harter Gate: Findet gitleaks ein Secret, gibt es weder Build noch Deploy.
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gesamte Historie scannen
      - uses: gitleaks/gitleaks-action@v2
        if: github.event_name != 'repository_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Die Action kennt repository_dispatch nicht („event is not yet supported“)
      # — genau das schickt das CMS-Repo nach jeder Änderung (cms-updated). Dann
      # prüft dieselbe gitleaks-Version direkt, über die ganze Historie und mit
      # .gitleaks.toml; ein Fund bricht wie oben alles ab.
      - name: gitleaks (CLI) bei repository_dispatch
        if: github.event_name == 'repository_dispatch'
        # Prüfsumme fest hinterlegt (nicht aus derselben Quelle geladen): ein
        # veränderter Download bricht ab, bevor er den Secret-Gate stellt.
        env:
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner

  # ─── Build ─────────────────────────────────────────────────────────
  build:
    needs: [lint, test, secret-scan]
    runs-on: ubuntu-latest
    env:
      HAS_CMS_KEY: ${{ secrets.CMS_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_CHAT_ENDPOINT: ${{ vars.VITE_CHAT_ENDPOINT }}
          VITE_GATE_HASH: ${{ vars.VITE_GATE_HASH }}

      # ─── CMS unter /cms/ ─────────────────────────────────────────────
      # Das Redaktionssystem liegt im privaten Repo rethink-cms und wird hier
      # mitgebaut. Gelesen wird mit einem Deploy-Key (nur lesen, nur dieses
      # Repo) im Secret CMS_DEPLOY_KEY. Scheitert ein Schritt, geht die Website
      # trotzdem raus — dann nur ohne /cms/, bis der nächste Lauf klappt.
      # Supabase-Adresse und Anon-Key sind öffentlich (Rechte regelt RLS) und
      # liegen deshalb als Variablen, nicht als Secrets.
      - name: CMS auschecken
        id: cms_checkout
        if: env.HAS_CMS_KEY == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: RainerSchulz/rethink-cms
          ssh-key: ${{ secrets.CMS_DEPLOY_KEY }}
          path: cms-src
      - name: CMS prüfen und bauen
        id: cms_build
        if: steps.cms_checkout.outcome == 'success'
        continue-on-error: true
        working-directory: cms-src
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLISH_WEBHOOK: ${{ vars.VITE_PUBLISH_WEBHOOK }}
          VITE_SITE_BASE: https://rethink.space
        run: |
          # Ohne Supabase liefe das CMS öffentlich im Demo-Modus — lieber gar nicht.
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Variablen VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY fehlen — CMS wird nicht ausgeliefert."
            exit 1
          fi
          npm ci
          npm run test:run
          npm run build:site
      - name: CMS nach dist/cms/
        if: steps.cms_build.outcome == 'success'
        run: cp -r cms-src/dist dist/cms
      - name: Hinweis, falls das CMS fehlt
        if: steps.cms_build.outcome != 'success'
        run: echo "::warning::Diese Auslieferung enthält kein CMS unter /cms/ (Deploy-Key, Variablen oder CMS-Build prüfen)."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ─── Deploy auf GitHub Pages (nur main) ────────────────────────────
  # Voraussetzung: Repo-Settings → Pages → Source = "GitHub Actions".
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
