server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Weiterleitungen relativ ausgeben: hinter einem Reverse-Proxy kennt nginx
    # nur http, ein absoluter Redirect würde von https auf http wechseln.
    absolute_redirect off;

    # www. ist keine zweite Adresse — sonst zwei URLs, ein Inhalt.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Sicherheits-Header — wirken nur als echte HTTP-Header, nicht im <meta>.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Healthcheck für Docker
    location = /health/ {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Gebaute Assets tragen einen Hash im Namen → dauerhaft cachen
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Bilder: lange cachen, aber revalidierbar
    location /Bilder/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /robots.txt  { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    # Seiten: /pages/<name>/ → index.html; alles Unbekannte → 404-Seite
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
